plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aali.ebookreader'
    compileSdk 34

    defaultConfig {
        applicationId "com.aali.ebookreader"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "1.8"
    }

    // The offline OCR engine ships native code for four processor types.
    // Splitting keeps the APK you install about a third smaller.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // PDF rendering (fork of barteksc AndroidPdfViewer published on Maven Central)
    implementation 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.3'
    // PDF text extraction
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    // EPUB / HTML parsing
    implementation 'org.jsoup:jsoup:1.17.2'
    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'
    // HTTP for Gemini AI
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Offline OCR for scanned PDF pages (model bundled, no internet needed)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
